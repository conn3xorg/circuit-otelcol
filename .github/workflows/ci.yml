name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Check the collector takes OTLP and exports host metrics
        working-directory: examples/local
        run: sudo podman exec -i circuit-otelcol sh < check.sh
      # The example's OTLP_TOKEN stands in for an exporter's API key. It has
      # to reach the collector's environment file and stay out of state.
      - name: Check the environment reached the host and stayed out of state
        working-directory: examples/local
        run: |
          sudo podman exec circuit-otelcol grep -qx 'OTLP_TOKEN=.*example-otlp-token.*' /etc/otelcol-contrib/conn3x.env
          if grep -q example-otlp-token terraform.tfstate; then
            echo "OTLP_TOKEN is in terraform.tfstate." >&2
            exit 1
          fi
      # Restarting the container boots systemd again, so this checks the
      # collector comes back by itself, still takes OTLP, and the plan has
      # nothing to do.
      - name: Restart the host, then check the collector and the plan
        working-directory: examples/local
        run: |
          sudo podman restart circuit-otelcol
          for _ in $(seq 60); do
            case $(sudo podman exec circuit-otelcol systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          sudo podman exec -i circuit-otelcol sh < check.sh
          conn3x plan -detailed-exitcode
      # A fresh host gets the previous release, then the circuit's own pin is
      # applied over it, the way someone raises otelcol_version.
      - name: Upgrade from collector 0.163.2 on a fresh host, then plan again with no changes
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: |
          ./down.sh
          ./up.sh
          conn3x init
          conn3x apply -auto-approve -var otelcol_version=0.163.2 \
            -var 'checksums={"otelcol-contrib_amd64.deb"="5a175c93c5a560368c1bdbf0ec25fdc06e7b7d852f424bf7dbc36da6fd495db7","otelcol-contrib_amd64.rpm"="5ba5c948c35caebcb436cb1fde6e697d31d00964164ed87e308822430a8e53f0"}'
          sudo podman exec circuit-otelcol otelcol-contrib --version | grep -q ' 0\.163\.2$'
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          test "$(sudo podman exec circuit-otelcol otelcol-contrib --version | awk '{print $NF}')" = "$(sed -n '/variable "otelcol_version"/,/^}/s/.*default *= *"\(.*\)"/\1/p' ../../variables.tf)"
      - name: Check the upgraded collector takes OTLP and exports host metrics
        working-directory: examples/local
        run: sudo podman exec -i circuit-otelcol sh < check.sh
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh

