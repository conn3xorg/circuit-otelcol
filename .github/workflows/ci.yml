name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # The live config is the one validate passed, with DEPLOY_ENV from the
      # write-only environment file. A log posted over OTLP reaches the file
      # exporter with that value, and host metrics reach the Prometheus
      # exporter.
      - name: Check the collector takes OTLP and exports host metrics
        run: |
          sudo podman exec -i circuit-otelcol sh -eu <<'EOF'
          for _ in $(seq 30); do systemctl is-active -q otelcol-contrib && break; sleep 1; done
          systemctl is-active otelcol-contrib
          cmp /etc/otelcol-contrib/config.yaml.conn3x /etc/otelcol-contrib/config.yaml
          [ "$(stat -c %a /etc/otelcol-contrib/conn3x.env)" = 600 ]
          (set -a; . /etc/otelcol-contrib/conn3x.env; otelcol-contrib validate --config=/etc/otelcol-contrib/config.yaml)
          for _ in $(seq 30); do
            curl -sf -X POST -H 'Content-Type: application/json' http://127.0.0.1:4318/v1/logs \
              -d '{"resourceLogs":[{"scopeLogs":[{"logRecords":[{"body":{"stringValue":"hello-from-ci"}}]}]}]}' && break
            sleep 1
          done
          for _ in $(seq 30); do
            grep -q hello-from-ci /tmp/otelcol-out.json 2>/dev/null && break
            sleep 1
          done
          grep hello-from-ci /tmp/otelcol-out.json | grep -q '"deployment.environment","value":{"stringValue":"local"}'
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8889/metrics | grep -q '^system_cpu_' && exit 0
            sleep 1
          done
          exit 1
          EOF
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh

